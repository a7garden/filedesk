[workspace]
resolver = "2"
members = [
    "crates/fd-core",
    "crates/fd-shell",
    "crates/fd-cli",
    "crates/fd-index",
    "crates/fd-indexd",
    "crates/fd-content",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
png = "0.17"
notify = "8"
clap = { version = "4", features = ["derive"] }
# 2026.11.12 : 색인 — 나눠 훑기 · 나눠 찾기(rayon), 본문 전문 색인(tantivy), 관리자 도우미 서비스(windows-service · tokio 이름 파이프).
rayon = "1"
tantivy = "0.22"
windows-service = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
# 2026.11.11 : tauri 2.12 가 쓰는 판과 맞춘다. 판이 갈리면 HWND 같은 타입이 둘이 되어 변환이 늘어난다.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Ioctl",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
fd-core = { path = "crates/fd-core" }
fd-shell = { path = "crates/fd-shell" }
fd-index = { path = "crates/fd-index" }
fd-content = { path = "crates/fd-content" }

[profile.release]
lto = "thin"
codegen-units = 4
