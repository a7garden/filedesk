[workspace]
resolver = "2"
members = [
    "crates/fd-core",
    "crates/fd-shell",
    "crates/fd-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
png = "0.17"
notify = "8"
clap = { version = "4", features = ["derive"] }
# 2026.11.11 : tauri 2.12 가 쓰는 판과 맞춘다. 판이 갈리면 HWND 같은 타입이 둘이 되어 변환이 늘어난다.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Environment",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
fd-core = { path = "crates/fd-core" }
fd-shell = { path = "crates/fd-shell" }

[profile.release]
lto = "thin"
codegen-units = 4
