[package]
name = "filedesk-desktop"
description = "filedesk 데스크톱 앱 (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "filedesk_desktop"
path = "src/lib.rs"

[[bin]]
name = "filedesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
# 2026.11.11 : oxb 와 같은 판으로 고정한다 — 내려받은 크레이트를 같이 쓰고, 한쪽에서 겪은 문제를 다른 쪽에 그대로 옮길 수 있게.
tauri = { version = "=2.12.0", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
notify = { workspace = true }
fd-core = { workspace = true }
fd-shell = { workspace = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
