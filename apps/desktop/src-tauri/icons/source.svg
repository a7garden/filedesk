  <!-- filedesk 아이콘: 폴더 + 판 눈금.
       2026.11.11 : 점 셋만 둔 사각 타일이 파일 관리자로 읽히지 않아(사용자 지적) 폴더 꼴로 바꿨다.
       앞판 위의 점 셋(흐린 둘 다음 큰 찬 점)은 목록 「판」 열의 그 모양 — 지난 판들 다음 최신판.
       16px 에서는 점이 뭉개져 폴더 꼴만 남는다. 그 크기에서 알아볼 것은 「파일 관리자」 하나면 된다. -->
