[package]
name = "fd-indexd"
description = "filedesk 색인 서비스: 관리자 권한으로 NTFS MFT 를 읽고 USN 저널로 따라가며, 이름 파이프로 찾기에 답한다"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fd-indexd"
path = "src/main.rs"

[dependencies]
fd-core = { workspace = true }
